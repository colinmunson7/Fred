# Fred (Fake Reddit) - source list and feed rules  (V1, 2026-11-20)
#
# This is the "settings screen" for Fred. To add, remove or move a source,
# ask Claude to edit this file (or edit it yourself on GitHub).
#
# Source types:
#   rss        - any RSS or Atom feed (url)
#   bluesky    - a public Bluesky profile (handle)
#   youtube    - a YouTube channel (channel_id); Shorts are skipped
#   dles       - one random daily game from dles.aukspot.com each edition
#   wikipedia  - random Wikipedia featured articles (count)
#   archive    - one random older post from a site's back catalogue, via either
#                a WordPress feed with pages (feed + pages) or a sitemap (sitemap)
#
# Optional per-source settings:
#   include: [words]   keep only items whose title mentions one of these
#   exclude: [words]   drop items whose title mentions any of these
#   extra: true        shown on top of the topic's cap (used for Wikipedia picks)
#   verify: true       feed wasn't confirmed during planning; a failure is expected and harmless
#
# Optional per-topic setting:
#   max: N             overrides max_per_topic for that section

settings:
  posts_per_batch: 25        # headlines in each morning/evening edition
  max_per_topic: 3           # keeps any one topic from taking over
  max_per_source: 3          # keeps any one site from taking over
  briefing_size: 8           # top-of-page news briefing
  reserve_size: 10           # extra items unlocked by "show a few more"
  lookback_hours: 36         # how far back a normal edition looks
  slow_topic_lookback_days: 10   # a slow source's newest post may be this old
  timezone: America/Los_Angeles

# "Happening Now": live-blog stories from these briefing sources, shown above the briefing.
happening_now:
  sources: [NPR News, New York Times]
  max: 3
  hours: 12

# The news briefing at the top of the page (not part of the 25).
briefing:
  - {name: NPR News, type: rss, url: "https://feeds.npr.org/1001/rss.xml"}
  - {name: Associated Press, type: rss, url: "https://flipboard.com/@associatedpress/top-stories-u7govdf1z.rss"}
  - {name: New York Times, type: rss, url: "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml"}
  - {name: ProPublica, type: rss, url: "https://www.propublica.org/feeds/propublica/main", verify: true}
  - {name: Techdirt, type: rss, url: "https://www.techdirt.com/feed/"}

# The interest feed: 12 sections, shown in this order.
topics:
  - key: climate
    label: Climate & Clean Energy
    sources:
      - {name: Utility Dive, type: rss, url: "https://www.utilitydive.com/feeds/news/"}
      - {name: Smart Cities Dive, type: rss, url: "https://www.smartcitiesdive.com/feeds/news/"}
      - {name: Canary Media, type: rss, url: "https://www.canarymedia.com/rss.rss"}
      - {name: The Urbanist, type: rss, url: "https://www.theurbanist.org/feed/"}

  - key: local
    label: Seattle
    sources:
      - {name: PubliCola, type: rss, url: "https://publicola.com/feed/"}
      - {name: Seattle Transit Blog, type: rss, url: "https://seattletransitblog.com/feed/"}
      - {name: Seattle Bike Blog, type: rss, url: "https://www.seattlebikeblog.com/feed/"}

  - key: outdoors
    label: Outdoors
    sources:
      - {name: ExplorersWeb, type: rss, url: "https://explorersweb.com/feed/"}
      - {name: iRunFar, type: rss, url: "https://www.irunfar.com/feed"}
      - name: Mountain Tactical Institute
        type: rss
        url: https://mtntactical.com/feed/
        exclude: [SWAT, AFROTC, USAF, military, tactical athlete, police, fire, army, marine, ranger, selection, operator]
      - {name: Stronger by Science, type: rss, url: "https://www.strongerbyscience.com/feed/"}
      - {name: TrainingBeta, type: rss, url: "https://www.trainingbeta.com/feed/"}
      # Parked: both block GitHub's servers (403). See the PRD's coverage gaps.
      # - {name: Uphill Athlete, type: rss, url: "https://uphillathlete.com/feed/"}
      # - {name: Sweat Science, type: rss, url: "https://sweatscience.substack.com/feed"}

  - key: dnd
    label: D&D
    sources:
      - {name: Sly Flourish, type: rss, url: "https://slyflourish.com/index.xml"}
      - {name: D&D Beyond, type: rss, url: "https://www.dndbeyond.com/posts.rss"}
      - {name: The Arcane Library, type: rss, url: "https://www.thearcanelibrary.com/blogs/news.atom"}
      - name: EN World
        type: rss
        url: https://www.enworld.org/ewr-porta/index.rss
        # EN World covers every tabletop game; keep only D&D stories.
        include: ["d&d", "dnd", "dungeons", "dragons", "5e", "5.5e", "wizards of the coast", "wotc",
                  "forgotten realms", "dungeon master", "player's handbook", "monster manual",
                  "dungeon master's guide", "critical role", "baldur", "greyhawk", "eberron",
                  "ravenloft", "spelljammer", "dragonlance"]

  - key: games
    label: Video Games
    sources:
      - name: Nintendo Life
        type: rss
        url: https://www.nintendolife.com/feeds/latest
        include: [pokemon, pokémon, zelda, stardew]
      - {name: Stardew Valley, type: rss, url: "https://www.stardewvalley.net/feed/"}
      - {name: "PokéCommunity: ROM Hacks", type: rss, url: "https://www.pokecommunity.com/forums/progressing-rom-hacks-showcase.67/index.rss"}
      - {name: "PokéCommunity: Challenges", type: rss, url: "https://www.pokecommunity.com/forums/202/index.rss"}

  - key: sports
    label: Sports
    sources:
      # The Athletic replaces ESPN, whose feeds came back empty on GitHub.
      - {name: The Athletic NFL, type: rss, url: "https://www.nytimes.com/athletic/rss/nfl/", verify: true}
      - {name: The Athletic Soccer, type: rss, url: "https://www.nytimes.com/athletic/rss/football/", verify: true}
      - {name: The Athletic College Football, type: rss, url: "https://www.nytimes.com/athletic/rss/college-football/", verify: true}
      - {name: The Equalizer, type: rss, url: "https://equalizersoccer.com/feed/"}
      - {name: Uni Watch, type: rss, url: "https://www.uni-watch.com/feed/"}

  - key: money
    label: Money
    sources:
      - name: A Wealth of Common Sense
        type: rss
        url: https://awealthofcommonsense.com/feed/
        # Written posts only: skip the podcast episodes.
        exclude: [Animal Spirits, Talk Your Book, Ask the Compound, podcast, TCAF]
      - name: Get Rich Slowly
        type: archive
        feed: https://www.getrichslowly.org/save/feed/
        pages: 12
      - name: The Evidence-Based Investor
        type: archive
        sitemap: https://www.evidenceinvestor.com/blog-posts-sitemap.xml
        # Skip UK-only topics.
        exclude: [isa, isas, premium bonds, budget, hmrc, sipp, pension, uk, britain, british, fca, gilts, chancellor, reeves, ftse]

  - key: clothing
    label: Clothing
    sources:
      - {name: Put This On, type: rss, url: "https://putthison.com/feed/"}

  - key: puzzles
    label: Puzzles
    sources:
      - {name: Daily game, type: dles}
      - {name: Diary of a Crossword Fiend, type: rss, url: "https://www.crosswordfiend.com/feed/"}
      - {name: Wikipedia, type: wikipedia, count: 3, extra: true}

  - key: humor
    label: Humor
    sources:
      - {name: The Onion, type: rss, url: "https://theonion.com/rss"}

  - key: bluesky
    label: Bluesky
    max: 4
    sources:
      - {name: Darth, type: bluesky, handle: darthbluesky.bsky.social}
      - {name: Peter, type: bluesky, handle: notalawyer.bsky.social}
      - {name: Rodger Sherman, type: bluesky, handle: rodger.bsky.social}
      - {name: Mina Kimes, type: bluesky, handle: minakimes.bsky.social}
      - {name: The Athletic FC, type: bluesky, handle: theathleticfc.bsky.social}
      - {name: Derek Guy, type: bluesky, handle: dieworkwear.bsky.social}

  - key: videos
    label: Videos
    sources:
      - {name: pChal, type: youtube, channel_id: UCvjsnl6wNtVIm0i1sCpN9Uw}
      - {name: WolfeyVGC, type: youtube, channel_id: UC9OZkS1Mhl5UvKSiPrYqsxg}
      - {name: The Adam Clery Football Channel, type: youtube, channel_id: UCRXVJv9f3oob6l3-ktUbXUA}
      - {name: Drew Gooden, type: youtube, channel_id: UCjtkaY_1JrDw6uUtwvcPsTg}
      - {name: Casual Finance, type: youtube, channel_id: UCrNfRFWnLC3tCy1TnyhVQ7g}
      - {name: More Perfect Union, type: youtube, channel_id: UCehBVAPy-bxmnbNARF-_tvA}

# Shown on the "you're caught up" screen, one per edition.
suggestions:
  - Do today's crossword
  - Read a chapter of your book
  - Go for a short walk or run
  - Plan your next D&D session
  - Clean something
